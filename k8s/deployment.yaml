apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-step-flow-frontend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-frontend
    app.kubernetes.io/component: frontend
  annotations:
    checkov.io/skip: CKV_K8S_43,CKV2_K8S_6  # CKV_K8S_43: Image digest not practical with Kustomize dynamic tags; CKV2_K8S_6: NetworkPolicy not implemented yet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-step-flow-frontend
  template:
    metadata:
      labels:
        app: digital-step-flow-frontend
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        # checkov:skip=CKV_K8S_43: Image digest not practical with Kustomize dynamic image tags
        image: raphaelmoraes/digital-step-flow-frontend:24.13.0-r1-dev
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_BASE_URL
          value: "http://digital-step-flow-backend/api"
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-logs
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}

