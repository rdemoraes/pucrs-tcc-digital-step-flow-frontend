apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-step-flow-frontend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-frontend
    app.kubernetes.io/component: frontend
  annotations:
    checkov.io/skip: CKV_K8S_43:Image digest not practical with Kustomize dynamic tags;CKV2_K8S_6:NetworkPolicy not implemented yet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-step-flow-frontend
  template:
    metadata:
      labels:
        app: digital-step-flow-frontend
        app.kubernetes.io/component: frontend
      annotations:
        container.apparmor.security.beta.kubernetes.io/nginx: runtime/default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Init container to copy static files from frontend image to shared volume
      initContainers:
      - name: copy-static-files
        # checkov:skip=CKV_K8S_43: Image digest not practical with Kustomize dynamic image tags
        image: raphaelmoraes/digital-step-flow-frontend:24.13.0-r1-dev
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        command: ['sh', '-c', 'cp -r /usr/share/nginx/html/* /shared/ && chmod -R 755 /shared']
        volumeMounts:
        - name: static-files
          mountPath: /shared
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      containers:
      # Nginx sidecar - serves static files from shared volume
      - name: nginx
        image: nginx:1.28.0-alpine
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: static-files
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: static-files
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-logs
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}

