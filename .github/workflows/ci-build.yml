name: CI Pipeline - Build

on:
  workflow_dispatch:  # Allow manual triggering
  workflow_run:
    workflows: ["CI Pipeline - QA"]
    branches: [ develop ]
    types: 
      - completed

# Prevent workflow from running on commits with [skip ci] or [ci skip]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKER_HUB_USERNAME: raphaelmoraes
  BASE_IMAGE: raphaelmoraes/digital-step-flow-base-node
  FRONTEND_IMAGE: raphaelmoraes/digital-step-flow-frontend
  NODEJS_VERSION: 24.13.0-r1
  NPM_VERSION: 11.6.3-r1

jobs:
  build:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [quality-gate-infra, quality-gate-code]
    # checkov:skip=CKV2_GHA_1: Permissions are specific (contents:write for tags, id-token:write for OIDC), not write-all
    permissions:
      contents: write  # Required to create tags
      # kics-scan:skip=a88baa34-e2ad-44ea-ad6f-8cac87bc7c71: id-token: write is a GitHub Actions permission for OIDC authentication, not a secret
      id-token: write  # Required for OIDC if using Docker registry authentication
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Get base image version
        id: base_version
        run: |
          # For now, use the same version. In production, you might want to fetch latest base image version
          BASE_VERSION="${{ steps.version.outputs.version }}"
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      
      - name: Build and push frontend image
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad
        with:
          files: docker-bake.hcl
          targets: frontend
          push: true
          set: |
            frontend.args.BASE_IMAGE_VERSION=${{ steps.base_version.outputs.base_version }}
            frontend.args.FRONTEND_IMAGE_VERSION=${{ steps.version.outputs.version }}
            frontend.tags=${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Pull image for scanning
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          skip-dirs: './.venv'
      
      - name: Save Trivy table output to file
        run: |
          trivy image \
            --skip-version-check \
            --scanners vuln \
            --skip-dirs "./.venv" \
            --ignore-unfixed \
            --format table \
            --severity CRITICAL,HIGH \
            --output trivy-image-frontend.txt \
            '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}' || true
      
      - name: Generate Trivy reports (HTML, XML, SBOM, JSON)
        env:
          IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          # Validate IMAGE_REF is set
          if [[ -z "${IMAGE_REF}" ]]; then
            echo "ERROR: IMAGE_REF is empty!" >&2
            echo "FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}" >&2
            echo "VERSION: ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "INFO: Scanning image: ${IMAGE_REF}"
          
          # Download templates
          mkdir -p /tmp/trivy-templates
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o /tmp/trivy-templates/trivy-html.tpl
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o /tmp/trivy-templates/trivy-junit.tpl || echo "JUnit template not available, skipping XML report"
          
          # Output options (without exit code to ensure reports are generated)
          TRIVY_OUTPUT_OPTS="--skip-version-check --scanners vuln --skip-dirs ./.venv --ignore-unfixed"
          
          # Generate HTML report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend.html --format template --template /tmp/trivy-templates/trivy-html.tpl "${IMAGE_REF}" >/dev/null 2>outerr_html.log || rc_html=$?
          if [[ ${rc_html:-0} -ne 0 && -f "./outerr_html.log" ]]; then
            echo "ERROR: Failed to generate HTML report:" >&2
            cat ./outerr_html.log >&2
          else
            echo "INFO: Scan completed. Result HTML output path $(pwd)/trivy-image-frontend.html"
          fi
          
          # Generate XML (JUnit) report
          if [[ -f /tmp/trivy-templates/trivy-junit.tpl ]]; then
            trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend.xml --format template --template /tmp/trivy-templates/trivy-junit.tpl "${IMAGE_REF}" >/dev/null 2>outerr_xml.log || rc_xml=$?
            if [[ ${rc_xml:-0} -ne 0 && -f "./outerr_xml.log" ]]; then
              echo "ERROR: Failed to generate XML report:" >&2
              cat ./outerr_xml.log >&2
            else
              echo "INFO: Scan completed. Result XML (Junit) output path $(pwd)/trivy-image-frontend.xml"
            fi
          fi
          
          # Generate SBOM report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend-sbom.json --format cyclonedx "${IMAGE_REF}" >/dev/null 2>outerr_sbom.log || rc_sbom=$?
          if [[ ${rc_sbom:-0} -ne 0 && -f "./outerr_sbom.log" ]]; then
            echo "ERROR: Failed to generate SBOM report:" >&2
            cat ./outerr_sbom.log >&2
          else
            echo "INFO: Scan completed. Result SBOM output path $(pwd)/trivy-image-frontend-sbom.json"
          fi
          
          # Generate JSON report
          trivy image ${TRIVY_OUTPUT_OPTS} --format json --output trivy-image-frontend.json "${IMAGE_REF}" >/dev/null 2>outerr_json.log || rc_json=$?
          if [[ ${rc_json:-0} -ne 0 && -f "./outerr_json.log" ]]; then
            echo "ERROR: Failed to generate JSON report:" >&2
            cat ./outerr_json.log >&2
          fi
      
      - name: Upload Trivy reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-reports-frontend
          path: |
            trivy-image-frontend.txt
            trivy-image-frontend.json
            trivy-image-frontend.html
            trivy-image-frontend.xml
            trivy-image-frontend-sbom.json
          retention-days: 30

