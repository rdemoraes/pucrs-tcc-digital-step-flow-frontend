name: CD Pipeline - Frontend

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'  # Semantic versioning tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allow manual triggering

# Prevent workflow from running on commits with [skip ci] or [ci skip]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: raphaelmoraes/digital-step-flow-frontend

jobs:
  k8s-set-deploy-image-dev:
    name: Update Kubernetes Manifests - Dev
    runs-on: ubuntu-latest
    # Only run on push to develop (after PR merge), not on PRs or tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.ref_type == 'branch'
    permissions:
      contents: write  # Required to push commits
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update frontend image in kustomization
        working-directory: ./k8s/dev
        run: |
          # Extract current image from kustomization.yaml
          OLD_IMAGE=$(grep "newTag:" kustomization.yaml | head -1 | sed 's/.*newTag: *//' | tr -d '"' || echo "")
          NEW_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Updating dev frontend image: ${OLD_IMAGE} -> ${NEW_IMAGE}"
          
          # Update kustomization.yaml using kustomize edit set image
          kustomize edit set image frontend=${NEW_IMAGE}
      
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add k8s/dev/kustomization.yaml
          git commit -m "chore: update dev image tag to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  k8s-set-deploy-image-prod:
    name: Update Kubernetes Manifests - Prod
    runs-on: ubuntu-latest
    # Only run on manual workflow_dispatch trigger on main/master branch, never automatically
    # Note: Ensure dev deployment has completed before triggering prod manually
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write  # Required to push commits
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update frontend image in kustomization
        working-directory: ./k8s/prod
        run: |
          # Extract current image from kustomization.yaml
          OLD_IMAGE=$(grep "newTag:" kustomization.yaml | head -1 | sed 's/.*newTag: *//' | tr -d '"' || echo "")
          NEW_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Updating prod frontend image: ${OLD_IMAGE} -> ${NEW_IMAGE}"
          
          # Update kustomization.yaml using kustomize edit set image
          kustomize edit set image frontend=${NEW_IMAGE}
      
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add k8s/prod/kustomization.yaml
          git commit -m "chore: update prod image tag to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
