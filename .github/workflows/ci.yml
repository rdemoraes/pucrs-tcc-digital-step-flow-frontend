name: CI Pipeline - QA

on:
  push:
    branches: [ develop ]
    tags:
      - 'v*.*.*'  # Semantic versioning tags: v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ develop ]

# Prevent workflow from running on commits with [skip ci] or [ci skip]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKER_HUB_USERNAME: raphaelmoraes
  BASE_IMAGE: raphaelmoraes/digital-step-flow-base-node
  FRONTEND_IMAGE: raphaelmoraes/digital-step-flow-frontend
  NODEJS_VERSION: 24.13.0-r1
  NPM_VERSION: 11.6.3-r1

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/coverage-final.json
          flags: frontend

  quality-gate-code:
    name: Quality Gate - Source Code
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Source Code
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: none
          # Exclude infrastructure files, build artifacts, and config files
          FILTER_REGEX_EXCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore|node_modules|\.git|dist|build|coverage|\.next|\.cache|postcss\.config\.js|tailwind\.config\.js|vite\.config\.ts|vitest\.config\.ts|src/vite-env\.d\.ts)
          # Enable code-focused linters
          ENABLE: JAVASCRIPT,TYPESCRIPT,BASH
          # Disable infrastructure linters and duplicate style checkers
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT_STANDARD,TYPESCRIPT_TS_STANDARD,REPOSITORY_KICS,REPOSITORY_CHECKOV,REPOSITORY_TRIVY,REPOSITORY_DEVSKIM,REPOSITORY_GITLEAKS,REPOSITORY_TRUFFLEHOG,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_DUSTILOCK,REPOSITORY_SYFT,REPOSITORY_TRIVY_SBOM,REPOSITORY_GIT_DIFF,DOCKER,YAML,JSON,MARKDOWN
          # Make some linters non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: BASH
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true

  quality-gate-infra:
    name: Quality Gate - Infra
    runs-on: ubuntu-latest
    needs: [lint, test, quality-gate-code]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Infrastructure
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          APPLY_FIXES: none
          # Only include infrastructure files
          FILTER_REGEX_INCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore)
          # Enable infrastructure-focused descriptors
          ENABLE: YAML,DOCKER
          # Explicitly enable only the repository linters we need
          ENABLE_LINTERS: REPOSITORY_KICS,REPOSITORY_CHECKOV,REPOSITORY_TRIVY
          # Disable all other linters
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT,TYPESCRIPT,JSON,MARKDOWN,BASH,REPOSITORY_DEVSKIM,REPOSITORY_GITLEAKS,REPOSITORY_TRUFFLEHOG,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_DUSTILOCK,REPOSITORY_SYFT,REPOSITORY_TRIVY_SBOM,REPOSITORY_GIT_DIFF
          # Skip specific Checkov checks
          REPOSITORY_CHECKOV_SKIP_CHECK: CKV_K8S_43,CKV2_K8S_6,CKV2_GHA_1
          # Exclude LOW and INFO severity findings from KICS
          REPOSITORY_KICS_ARGUMENTS: "--exclude-severities info,low --exclude-paths .github/workflows/*.yml"
          # Make yamllint non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: YAML
          FILTER_REGEX_EXCLUDE: (node_modules|\.git|dist|build|coverage|\.next|\.cache)
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true


