name: CI Pipeline - Frontend

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'  # Semantic versioning tags: v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ main, develop ]

# Prevent workflow from running on commits with [skip ci] or [ci skip]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKER_HUB_USERNAME: raphaelmoraes
  BASE_IMAGE: raphaelmoraes/digital-step-flow-base-node
  FRONTEND_IMAGE: raphaelmoraes/digital-step-flow-frontend
  NODEJS_VERSION: 24.13.0-r0
  NPM_VERSION: 11.6.3-r0

jobs:
  quality-gate-infra:
    name: Quality Gate - Infrastructure (K8s, ArgoCD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Infrastructure
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          APPLY_FIXES: none
          # Only include infrastructure files
          FILTER_REGEX_INCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore)
          # Enable infrastructure-focused descriptors
          ENABLE: YAML,DOCKER
          # Explicitly enable only the repository linters we need
          ENABLE_LINTERS: REPOSITORY_KICS,REPOSITORY_CHECKOV,REPOSITORY_TRIVY
          # Disable all other linters
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT,TYPESCRIPT,JSON,MARKDOWN,BASH,REPOSITORY_DEVSKIM,REPOSITORY_GITLEAKS,REPOSITORY_TRUFFLEHOG,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_DUSTILOCK,REPOSITORY_SYFT,REPOSITORY_TRIVY_SBOM,REPOSITORY_GIT_DIFF
          # Skip specific Checkov checks
          REPOSITORY_CHECKOV_SKIP_CHECK: CKV_K8S_43,CKV2_K8S_6,CKV2_GHA_1
          # Exclude LOW and INFO severity findings from KICS
          REPOSITORY_KICS_ARGUMENTS: "--exclude-severities info,low --exclude-paths .github/workflows/ci.yml"
          # Make yamllint non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: YAML
          FILTER_REGEX_EXCLUDE: (node_modules|\.git|dist|build|coverage|\.next|\.cache)
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true

  quality-gate-code:
    name: Quality Gate - Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Source Code
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: none
          # Exclude infrastructure files, build artifacts, and config files
          FILTER_REGEX_EXCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore|node_modules|\.git|dist|build|coverage|\.next|\.cache|postcss\.config\.js|tailwind\.config\.js|vite\.config\.ts|vitest\.config\.ts|src/vite-env\.d\.ts)
          # Enable code-focused linters
          ENABLE: JAVASCRIPT,TYPESCRIPT,BASH
          # Disable infrastructure linters and duplicate style checkers
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT_STANDARD,TYPESCRIPT_TS_STANDARD,REPOSITORY_KICS,REPOSITORY_CHECKOV,REPOSITORY_TRIVY,REPOSITORY_DEVSKIM,REPOSITORY_GITLEAKS,REPOSITORY_TRUFFLEHOG,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_DUSTILOCK,REPOSITORY_SYFT,REPOSITORY_TRIVY_SBOM,REPOSITORY_GIT_DIFF,DOCKER,YAML,JSON,MARKDOWN
          # Make some linters non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: BASH
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/coverage-final.json
          flags: frontend

  build:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [quality-gate-infra, quality-gate-code, lint, test]
    # checkov:skip=CKV2_GHA_1: Permissions are specific (contents:write for tags, id-token:write for OIDC), not write-all
    permissions:
      contents: write  # Required to create tags
      # kics-scan:skip=a88baa34-e2ad-44ea-ad6f-8cac87bc7c71: id-token: write is a GitHub Actions permission for OIDC authentication, not a secret
      id-token: write  # Required for OIDC if using Docker registry authentication
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Get base image version
        id: base_version
        run: |
          # For now, use the same version. In production, you might want to fetch latest base image version
          BASE_VERSION="${{ steps.version.outputs.version }}"
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      
      - name: Build and push frontend image
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad
        with:
          files: docker-bake.hcl
          targets: frontend
          push: true
          set: |
            frontend.args.BASE_IMAGE_VERSION=${{ steps.base_version.outputs.base_version }}
            frontend.args.BASE_IMAGE_PROD=${{ env.BASE_IMAGE }}:${{ steps.base_version.outputs.base_version }}
            frontend.args.BASE_IMAGE_DEV=${{ env.BASE_IMAGE }}:${{ steps.base_version.outputs.base_version }}-dev
            frontend.args.FRONTEND_IMAGE_VERSION=${{ steps.version.outputs.version }}
            frontend.tags=${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Pull image for scanning
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          skip-dirs: './.venv'
      
      - name: Save Trivy table output to file
        run: |
          trivy image \
            --skip-version-check \
            --scanners vuln \
            --skip-dirs "./.venv" \
            --ignore-unfixed \
            --format table \
            --severity CRITICAL,HIGH \
            --output trivy-image-frontend.txt \
            '${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}' || true
      
      - name: Generate Trivy reports (HTML, XML, SBOM, JSON)
        env:
          IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          # Validate IMAGE_REF is set
          if [[ -z "${IMAGE_REF}" ]]; then
            echo "ERROR: IMAGE_REF is empty!" >&2
            echo "FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}" >&2
            echo "VERSION: ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "INFO: Scanning image: ${IMAGE_REF}"
          
          # Download templates
          mkdir -p /tmp/trivy-templates
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o /tmp/trivy-templates/trivy-html.tpl
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o /tmp/trivy-templates/trivy-junit.tpl || echo "JUnit template not available, skipping XML report"
          
          # Output options (without exit code to ensure reports are generated)
          TRIVY_OUTPUT_OPTS="--skip-version-check --scanners vuln --skip-dirs ./.venv --ignore-unfixed"
          
          # Generate HTML report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend.html --format template --template /tmp/trivy-templates/trivy-html.tpl "${IMAGE_REF}" >/dev/null 2>outerr_html.log || rc_html=$?
          if [[ ${rc_html:-0} -ne 0 && -f "./outerr_html.log" ]]; then
            echo "ERROR: Failed to generate HTML report:" >&2
            cat ./outerr_html.log >&2
          else
            echo "INFO: Scan completed. Result HTML output path $(pwd)/trivy-image-frontend.html"
          fi
          
          # Generate XML (JUnit) report
          if [[ -f /tmp/trivy-templates/trivy-junit.tpl ]]; then
            trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend.xml --format template --template /tmp/trivy-templates/trivy-junit.tpl "${IMAGE_REF}" >/dev/null 2>outerr_xml.log || rc_xml=$?
            if [[ ${rc_xml:-0} -ne 0 && -f "./outerr_xml.log" ]]; then
              echo "ERROR: Failed to generate XML report:" >&2
              cat ./outerr_xml.log >&2
            else
              echo "INFO: Scan completed. Result XML (Junit) output path $(pwd)/trivy-image-frontend.xml"
            fi
          fi
          
          # Generate SBOM report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-frontend-sbom.json --format cyclonedx "${IMAGE_REF}" >/dev/null 2>outerr_sbom.log || rc_sbom=$?
          if [[ ${rc_sbom:-0} -ne 0 && -f "./outerr_sbom.log" ]]; then
            echo "ERROR: Failed to generate SBOM report:" >&2
            cat ./outerr_sbom.log >&2
          else
            echo "INFO: Scan completed. Result SBOM output path $(pwd)/trivy-image-frontend-sbom.json"
          fi
          
          # Generate JSON report
          trivy image ${TRIVY_OUTPUT_OPTS} --format json --output trivy-image-frontend.json "${IMAGE_REF}" >/dev/null 2>outerr_json.log || rc_json=$?
          if [[ ${rc_json:-0} -ne 0 && -f "./outerr_json.log" ]]; then
            echo "ERROR: Failed to generate JSON report:" >&2
            cat ./outerr_json.log >&2
          fi
      
      - name: Upload Trivy reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-reports-frontend
          path: |
            trivy-image-frontend.txt
            trivy-image-frontend.json
            trivy-image-frontend.html
            trivy-image-frontend.xml
            trivy-image-frontend-sbom.json
          retention-days: 30

  update-k8s-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    # Only run on push to main/develop (after PR merge), not on PRs or tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.ref_type == 'branch'
    needs: [build]
    permissions:
      contents: write  # Required to push commits
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update frontend image in kustomization
        working-directory: ./k8s
        run: |
          # Extract current image from deployment.yaml
          OLD_IMAGE=$(grep "image:" deployment.yaml | head -1 | sed 's/.*image: *//' | tr -d '"' || echo "")
          NEW_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "Updating frontend image: ${OLD_IMAGE} -> ${NEW_IMAGE}"
          
          # Update deployment.yaml directly
          sed -i "s|image:.*digital-step-flow-frontend.*|image: ${NEW_IMAGE}|g" deployment.yaml
          
          # Update kustomization.yaml using kustomize edit set image
          kustomize edit set image frontend=${NEW_IMAGE}
      
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add k8s/kustomization.yaml k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

