version: '3.8'

# Docker Compose para desenvolvimento local do Frontend
# Uses nginx as sidecar pattern
services:
  # Frontend container - copies static files to shared volume
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-step-flow-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - static-files:/shared
    command: sh -c "cp -r /usr/share/nginx/html/* /shared/ && sleep infinity"
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
  
  # Nginx sidecar - serves static files
  nginx:
    image: nginx:1.28.0-alpine
    container_name: digital-step-flow-frontend-nginx
    ports:
      - "127.0.0.1:3000:3000"  # Bind to localhost only
    volumes:
      - static-files:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - nginx-run:/var/run
      - nginx-tmp:/tmp
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    # No cap_add needed - nginx on port 3000 (>1024) doesn't require NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  static-files:
  nginx-cache:
  nginx-logs:
  nginx-run:
  nginx-tmp:

networks:
  app-network:
    driver: bridge

