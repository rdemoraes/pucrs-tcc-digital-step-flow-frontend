version: '3.8'

# Docker Compose para desenvolvimento local do Frontend
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-step-flow-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    ports:
      - "127.0.0.1:3000:3000"  # Bind to localhost only
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - nginx-run:/var/run
      - nginx-tmp:/tmp
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    # No cap_add needed - nginx on port 3000 (>1024) doesn't require NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  nginx-cache:
  nginx-logs:
  nginx-run:
  nginx-tmp:

networks:
  app-network:
    driver: bridge

